<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harish J | Resume</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #111;
      background: #faf6ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 3px solid #111;
      background: #ffe14d;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .download-button {
      display: inline-block;
      padding: 0.7rem 1rem;
      border: 2px solid #111;
      background: #111;
      color: #ffe14d;
      font-weight: 700;
      text-decoration: none;
    }

    .download-button:hover {
      background: #333;
    }

    main {
      height: calc(100vh - 75px);
      padding: 1rem;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 3px solid #111;
      background: #fff;
    }

    @media (max-width: 520px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        height: calc(100vh - 125px);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>HARISH J — Resume</h1>
    <a
      class="download-button"
      href="/Harish_J_Software_Engineer_Resume.pdf"
      download="Harish_J_Software_Engineer_Resume.pdf"
    >
      Download Resume PDF
    </a>
  </header>
  <main>
    <iframe
      src="/Harish_J_Software_Engineer_Resume.pdf"
      title="Harish J resume"
    ></iframe>
  </main>
</body>
</html>
